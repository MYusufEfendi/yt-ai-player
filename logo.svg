<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0F24" />
      <stop offset="100%" stop-color="#090A12" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E55" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E55" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="textAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B69" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark (Squircle 52x52) -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="1.6"/>
    <g filter="url(#logoGlow)">
      <!-- Soundwave bars -->
      <rect x="10" y="24" width="2.4" height="8" rx="1.2" fill="url(#logoAccent)" opacity="0.7"/>
      <rect x="14" y="19" width="2.4" height="18" rx="1.2" fill="url(#logoAccent)" opacity="0.9"/>

      <!-- Play triangle -->
      <path d="M19.5 17.5C19.5 16.4 20.7 15.7 21.6 16.2L34 23.5C34.8 24.0 34.8 25.4 34 25.9L21.6 33.2C20.7 33.7 19.5 33.0 19.5 31.9V17.5Z" fill="url(#logoAccent)" />

      <!-- Sparkle star -->
      <path d="M37 9C37 12 34.8 14.2 31.8 14.2C34.8 14.2 37 16.4 37 19.4C37 16.4 39.2 14.2 42.2 14.2C39.2 14.2 37 12 37 9Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="41" cy="23.5" r="1.3" fill="#C084FC" opacity="0.85"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(70, 0)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      YT <tspan fill="url(#textAiGrad)">AI</tspan> Player
    </text>
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      AI Music Discovery &amp; Player
    </text>
  </g>
</svg>

