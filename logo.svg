<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="textAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Icon Mark (Squircle 52x52 on Light Ceramic) -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#lightBg)" stroke="#E2E8F0" stroke-width="1.4" filter="url(#softShadow)"/>
    
    <!-- Soundwave bars -->
    <rect x="11" y="24" width="2.6" height="8" rx="1.3" fill="url(#logoAccent)" opacity="0.8"/>
    <rect x="15" y="19" width="2.6" height="18" rx="1.3" fill="url(#logoAccent)"/>

    <!-- Play triangle -->
    <path d="M20.5 17.5C20.5 16.4 21.7 15.7 22.6 16.2L35 23.5C35.8 24.0 35.8 25.4 35 25.9L22.6 33.2C21.7 33.7 20.5 33.0 20.5 31.9V17.5Z" fill="url(#logoAccent)" />

    <!-- Sparkle star -->
    <path d="M38 9C38 12 35.8 14.2 32.8 14.2C35.8 14.2 38 16.4 38 19.4C38 16.4 40.2 14.2 43.2 14.2C40.2 14.2 38 12 38 9Z" fill="#F59E0B" />
    <circle cx="42" cy="23.5" r="1.3" fill="#8B5CF6" />
  </g>

  <!-- Typography (Light Mode: Clean Dark Slate + Vibrant AI Accent) -->
  <g transform="translate(70, 0)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      YT <tspan fill="url(#textAiGrad)">AI</tspan> Player
    </text>
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="0.2">
      AI Music Discovery &amp; Player
    </text>
  </g>
</svg>
