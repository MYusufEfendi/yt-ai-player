<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#FF0055" flood-opacity="0.3" />
    </filter>
    <style>
      .logo-title { font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; letter-spacing: -0.4px; }
      .logo-sub { font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", sans-serif; font-size: 10px; font-weight: 600; fill: #64748B; letter-spacing: 0.3px; }
      @media (prefers-color-scheme: dark) {
        .logo-title { fill: #FFFFFF; }
        .logo-sub { fill: #94A3B8; }
      }
    </style>
  </defs>

  <!-- Left: Circular Brand Mark (44x44) -->
  <g transform="translate(6, 6)" filter="url(#markShadow)">
    <circle cx="22" cy="22" r="22" fill="url(#brandGrad)"/>
    <circle cx="22" cy="22" r="17" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.35"/>
    <!-- Play Triangle with AI Sparkle Cutout -->
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#FFFFFF" d="
      M 16 12
      C 16 10.7 17.5 9.9 18.6 10.5
      L 31.6 18.0
      C 32.7 18.6 32.7 20.2 31.6 20.8
      L 18.6 28.3
      C 17.5 28.9 16 28.1 16 26.8
      Z
      M 22 15.2
      C 22 17.3 20.5 19.1 18.5 19.1
      C 20.5 19.1 22 20.9 22 23.0
      C 22 20.9 23.5 19.1 25.5 19.1
      C 23.5 19.1 22 17.3 22 15.2
      Z
    "/>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(62, 0)">
    <text x="0" y="29" class="logo-title">
      YT <tspan fill="url(#brandGrad)">AI</tspan> Player
    </text>
    <text x="0" y="44" class="logo-sub">
      INTELLIGENT MUSIC PLAYER
    </text>
  </g>
</svg>
