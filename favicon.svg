<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0F24" />
      <stop offset="100%" stop-color="#090A12" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E55" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Glowing Play & AI Group -->
  <g filter="url(#glow)">
    <!-- Equalizer soundbars -->
    <rect x="14" y="28" width="2.8" height="9" rx="1.4" fill="url(#accentGrad)" opacity="0.7"/>
    <rect x="18.5" y="22" width="2.8" height="21" rx="1.4" fill="url(#accentGrad)" opacity="0.9"/>

    <!-- YouTube Play Triangle -->
    <path d="M24.5 21C24.5 19.8 25.8 19.0 26.8 19.6L40 27.6C41 28.2 41 29.8 40 30.4L26.8 38.4C25.8 39.0 24.5 38.2 24.5 37.0V21Z" fill="url(#accentGrad)" />

    <!-- AI Sparkle 4-point star -->
    <path d="M44 11C44 14.5 41.5 17 38 17C41.5 17 44 19.5 44 23C44 19.5 46.5 17 50 17C46.5 17 44 14.5 44 11Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="48.5" cy="27.5" r="1.5" fill="#C084FC" opacity="0.9"/>
  </g>
</svg>

